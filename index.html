<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松東營造｜服裝尺寸統計</title>
  <style>
    :root { --primary: #1769aa; --bg: #f4f6f8; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      background: var(--bg);
      color: #222;
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    }

    main {
      max-width: 720px;
      margin: auto;
      padding: 22px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px #00000012;
    }

    h1 { margin: 0 0 8px; font-size: 24px; }
    .hint { margin: 0 0 12px; color: #666; line-height: 1.6; }
    #sync-status { margin: 0 0 18px; color: #555; font-size: 14px; }
    #sync-status.error { color: #b42318; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 12px;
      border: 1px solid #ccd2d8;
      border-radius: 8px;
      background: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .summary {
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 8px;
      background: #eef5fb;
      line-height: 1.8;
    }

    .person {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid #eee;
    }

    select {
      width: 140px;
      padding: 9px;
      border: 1px solid #c8cdd2;
      border-radius: 6px;
      background: #fff;
      font-size: 16px;
    }

    select:disabled { background: #f1f1f1; }

    .actions { margin-top: 20px; }

    .actions button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #b9d8b9;
      border-radius: 8px;
      background: #f3fbf3;
    }

    #result table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    #result th, #result td {
      padding: 8px 5px;
      border: 1px solid #d8dfd6;
      text-align: center;
    }

    @media (max-width: 480px) {
      main { padding: 17px 13px; }
      select { width: 125px; }
      #result th, #result td { padding: 7px 3px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>松東營造服裝尺寸統計</h1>
    <p class="hint">各裝置共用同一份資料。選擇尺寸後會自動儲存並同步，不需要另外提交。</p>
    <p id="sync-status" role="status">正在連接雲端資料庫…</p>

    <nav class="tabs" id="tabs" aria-label="服裝款式"></nav>
    <section id="content"></section>

    <div class="actions">
      <button id="download" type="button">下載統計 CSV</button>
    </div>

    <section id="result" aria-live="polite"></section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCxknCCYX8u0681PLY9z5cQwjG42hQS108",
      authDomain: "clothing-statistics.firebaseapp.com",
      projectId: "clothing-statistics",
      storageBucket: "clothing-statistics.firebasestorage.app",
      messagingSenderId: "515236128976",
      appId: "1:515236128976:web:12933bc008b369cc5b16d5"
    };

    const names = [
      "張主任", "江副理", "趙志勇", "黃義重", "王鴻儒", "馬慶安",
      "陳俊銘", "陳冠豪", "陳冠智", "廖俞昇", "朱柏瑄", "楊政偉",
      "楊登吉", "林士凱", "黃毓竣", "賴達樺", "陳昀陽", "羅煜淇",
      "張嘉汶", "詹喬筑", "劉雪貞", "廖庭緯", "陳俞碩", "郭侑明",
      "洪弘朋", "陳俊雄", "李修賢", "盧彬"
    ];
    const styles = ["薄外套", "厚外套", "長袖", "短袖"];
    const sizes = ["S", "L", "XL", "2XL", "3XL"];
    const selections = Object.fromEntries(
      styles.map(style => [style, Object.fromEntries(names.map(name => [name, ""]))])
    );

    let currentStyle = styles[0];
    let db;
    let ready = false;
    const status = document.getElementById("sync-status");
    const result = document.getElementById("result");

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function getRecordId(style, name) {
      return encodeURIComponent(`${style}__${name}`);
    }

    function getCounts(style) {
      const counts = Object.fromEntries(sizes.map(size => [size, 0]));
      names.forEach(name => {
        const size = selections[style][name];
        if (size) counts[size]++;
      });
      return counts;
    }

    function render() {
      document.getElementById("tabs").innerHTML = styles.map(style => `
        <button class="tab ${style === currentStyle ? "active" : ""}"
          type="button" data-style="${style}" aria-pressed="${style === currentStyle}">
          ${style}
        </button>
      `).join("");

      document.querySelectorAll(".tab").forEach(button => {
        button.addEventListener("click", () => {
          currentStyle = button.dataset.style;
          render();
        });
      });

      const counts = getCounts(currentStyle);
      const total = Object.values(counts).reduce((sum, count) => sum + count, 0);
      document.getElementById("content").innerHTML = `
        <div class="summary">
          <strong>${currentStyle}統計</strong><br>
          S：${counts.S}　L：${counts.L}　XL：${counts.XL}　2XL：${counts["2XL"]}　3XL：${counts["3XL"]}
          <br>已選尺寸：${total} 件
        </div>
        ${names.map((name, index) => `
          <label class="person" for="size-${index}">
            <span>${name}</span>
            <select id="size-${index}" data-name="${name}"
              aria-label="${name}的${currentStyle}尺寸" ${ready ? "" : "disabled"}>
              <option value="">不訂購／選擇尺寸</option>
              ${sizes.map(size => `
                <option value="${size}" ${selections[currentStyle][name] === size ? "selected" : ""}>${size}</option>
              `).join("")}
            </select>
          </label>
        `).join("")}
      `;

      document.querySelectorAll("#content select").forEach(select => {
        select.addEventListener("change", saveSelection);
      });
    }

    async function saveSelection(event) {
      const name = event.target.dataset.name;
      const size = event.target.value;
      const style = currentStyle;
      selections[style][name] = size;
      render();
      setStatus("正在儲存並同步…");

      try {
        const record = doc(db, "orders", getRecordId(style, name));
        if (size) {
          await setDoc(record, { style, name, size, updatedAt: serverTimestamp() });
        } else {
          await deleteDoc(record);
        }
        setStatus("已同步：所有裝置都會看到最新資料");
      } catch (error) {
        console.error("Firebase save error:", error);
        setStatus("儲存失敗，請檢查網路與 Firebase 設定後重試。", true);
      }
    }

    function csvCell(value) {
      return `"${String(value).replaceAll('"', '""')}"`;
    }

    function downloadCsv() {
      const rows = [["公司名稱", "姓名", "款式", "尺寸"]];
      styles.forEach(style => names.forEach(name => {
        const size = selections[style][name];
        if (size) rows.push(["松東營造", name, style, size]);
      }));

      if (rows.length === 1) {
        alert("目前尚未選擇任何尺寸。");
        return;
      }

      const csv = "\uFEFF" + rows.map(row => row.map(csvCell).join(",")).join("\r\n");
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "松東營造服裝尺寸統計.csv";
      link.click();
      URL.revokeObjectURL(url);
      showResult();
    }

    function showResult() {
      let html = `
        <h2>目前統計</h2>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>款式</th>${sizes.map(size => `<th>${size}</th>`).join("")}<th>合計</th></tr></thead>
          <tbody>
      `;
      styles.forEach(style => {
        const counts = getCounts(style);
        const total = Object.values(counts).reduce((sum, count) => sum + count, 0);
        html += `<tr><td>${style}</td>${sizes.map(size => `<td>${counts[size]}</td>`).join("")}<td>${total}</td></tr>`;
      });
      result.innerHTML = html + "</tbody></table></div>";
      result.style.display = "block";
      result.scrollIntoView({ behavior: "smooth" });
    }

    document.getElementById("download").addEventListener("click", downloadCsv);
    render();

    async function connectFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        const auth = getAuth(app);
        await signInAnonymously(auth);

        onSnapshot(collection(db, "orders"), snapshot => {
          styles.forEach(style => names.forEach(name => { selections[style][name] = ""; }));
          snapshot.forEach(item => {
            const record = item.data();
            if (styles.includes(record.style) && names.includes(record.name) && sizes.includes(record.size)) {
              selections[record.style][record.name] = record.size;
            }
          });
          ready = true;
          setStatus("已連線並同步：選擇尺寸會自動儲存");
          render();
        }, error => {
          console.error("Firebase listener error:", error);
          setStatus("無法讀取共用資料，請確認 Firestore 規則與設定。", true);
        });
      } catch (error) {
        console.error("Firebase connection error:", error);
        setStatus("連線失敗，請確認匿名登入與 Firestore 已啟用。", true);
      }
    }

    connectFirebase();
  </script>
</body>
</html>
